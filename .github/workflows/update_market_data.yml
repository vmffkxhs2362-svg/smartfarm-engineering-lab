name: 24/7 Cloud Market Data Auto-Updater

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Market Data Updater Script
        run: python scripts/update_market_data.py

      - name: Run Static Build
        run: python build.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Antigravity Cloud Bot"
          git config --global user.email "bot@inwoovation.com"
          git add data/global_prices.json sitemap.xml *.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: 24/7 cloud daily market data update" && git push)
