<!-- TITLE: Global Agricultural Market Index | AgTech Precision Suite -->
<!-- DESC: Real-time tracking of global wholesale prices for agricultural commodities including tomatoes, cucumbers, peppers, and natural gas. -->
<!-- KEYWORDS: smart farm, market index, agricultural prices, natural gas price, wholesale tomatoes, wholesale cucumber, wholesale pepper -->
<!-- ACTIVE_TAB: btn-tab-market -->
<!-- ACTIVE_CHIP: chip-market -->
<div class="calc-wrapper active" id="section-market" style="grid-template-columns: 1fr;">
<div class="market-dashboard-embedded" style="margin-bottom: 3rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--primary);">🌍 Global Agri-Market Index</h2>
            <p style="color: var(--text-secondary);">Real-time tracking of wholesale prices across major global markets.</p>
            <div class="last-updated" id="update-timestamp" style="display: inline-block; background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 0.4rem 1rem; border-radius: 2rem; font-size: 0.85rem; font-weight: 500; margin-top: 1rem;">Loading latest data...</div>
        </div>

        <div class="controls-container" style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; background: var(--surface-light); padding: 1rem; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 1.5rem;">
            <div class="toggle-group" id="region-toggles" style="display: flex; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 0.25rem;">
                <button class="toggle-btn active" data-region="EU" onclick="setRegion('EU')" style="background: var(--primary); border: none; color: var(--bg-dark); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;">🇪🇺 EU (DE)</button>
                <button class="toggle-btn" data-region="US" onclick="setRegion('US')" style="background: transparent; border: none; color: var(--text-secondary); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;">🇺🇸 US</button>
                <button class="toggle-btn" data-region="MX" onclick="setRegion('MX')" style="background: transparent; border: none; color: var(--text-secondary); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;">🇲🇽 Mexico</button>
            </div>
            
            <div class="toggle-group" id="time-toggles" style="display: flex; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 0.25rem;">
                <button class="toggle-btn" data-days="2" onclick="setTimeframe(2)" style="background: transparent; border: none; color: var(--text-secondary); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;">1D</button>
                <button class="toggle-btn" data-days="7" onclick="setTimeframe(7)" style="background: transparent; border: none; color: var(--text-secondary); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;">1W</button>
                <button class="toggle-btn active" data-days="30" onclick="setTimeframe(30)" style="background: var(--primary); border: none; color: var(--bg-dark); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;">1M</button>
                <button class="toggle-btn" data-days="90" onclick="setTimeframe(90)" style="background: transparent; border: none; color: var(--text-secondary); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;">3M</button>
                <button class="toggle-btn" data-days="365" onclick="setTimeframe(365)" style="background: transparent; border: none; color: var(--text-secondary); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;">1Y</button>
            </div>
        </div>

        <div class="metrics-grid" id="metrics-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 2rem;"></div>

        <div class="chart-container" style="position: relative; height: 400px; width: 100%; box-sizing: border-box; background: var(--surface-light); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
            <div style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;" id="agri-chart-title">🍅 Agricultural Commodities</div>
            <canvas id="agriChart"></canvas>
        </div>

        <div class="chart-container" id="energy-chart-wrapper" style="position: relative; height: 300px; width: 100%; box-sizing: border-box; background: var(--surface-light); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
            <div style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">⚡ Energy Impact (Natural Gas TTF)</div>
            <canvas id="energyChart"></canvas>
        </div>
        
        <div style="text-align: right; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 2rem; padding-right: 0.5rem;">
            <em>Data Sources: US/MX (USDA AMS Real-time API) &nbsp;|&nbsp; EU (German Wholesale Proxy / Simulated)</em>
        </div>
</div>
</div>

<!-- SCRIPTS_START -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.1/dist/chartjs-adapter-moment.min.js"></script>
<script src="common.js?v=2.2"></script><script type="text/javascript">

      }, 'google_translate_element');
    }

    <!-- Global Market Dashboard Logic -->
    <script>
        Chart.defaults.color = '#9ca3af';
        Chart.defaults.borderColor = '#374151';
        Chart.defaults.font.family = 'Inter, sans-serif';

        let globalData = null;
        let currentRegion = 'EU';
        let currentDays = 30;
        let agriChartInstance = null;
        let energyChartInstance = null;

        async function initMarketDashboard() {
            try {
                const isHttp = window.location.protocol.startsWith('http');
                const jsonPath = isHttp ? '/data/global_prices.json' : 'data/global_prices.json';
                const response = await fetch(jsonPath + '?t=' + new Date().getTime());
                globalData = await response.json();
                document.getElementById('update-timestamp').innerText = `Last Checked: ${globalData.last_updated}`;
                
                if (!globalData.markets && globalData.datasets) {
                    globalData = { markets: { "EU": { name: "EU", datasets: globalData.datasets } } };
                }
                
                // Override backend legacy name directly in frontend
                if (globalData.markets && globalData.markets['EU']) {
                    if (globalData.markets['EU'].name.includes("NL/ES")) {
                        globalData.markets['EU'].name = "European Union (DE)";
                    }
                }
                
                updateDashboard();
            } catch (e) {
                console.error(e);
                const ts = document.getElementById('update-timestamp');
                if(ts) {
                    ts.innerText = "Data feed currently unavailable.";
                    ts.style.color = "#ef4444";
                    ts.style.background = "rgba(239, 68, 68, 0.1)";
                }
            }
        }

        function setRegion(region) {
            currentRegion = region;
            document.querySelectorAll('#region-toggles .toggle-btn').forEach(btn => {
                if(btn.dataset.region === region) {
                    btn.classList.add('active');
                    btn.style.background = '#3b82f6';
                    btn.style.color = 'white';
                } else {
                    btn.classList.remove('active');
                    btn.style.background = 'transparent';
                    btn.style.color = 'var(--text-secondary)';
                }
            });
            updateDashboard();
        }

        function setTimeframe(days) {
            currentDays = days;
            document.querySelectorAll('#time-toggles .toggle-btn').forEach(btn => {
                if(parseInt(btn.dataset.days) === days) {
                    btn.classList.add('active');
                    btn.style.background = '#3b82f6';
                    btn.style.color = 'white';
                } else {
                    btn.classList.remove('active');
                    btn.style.background = 'transparent';
                    btn.style.color = 'var(--text-secondary)';
                }
            });
            updateDashboard();
        }

        function updateDashboard() {
            if (!globalData || !globalData.markets[currentRegion]) return;
            
            const marketData = globalData.markets[currentRegion];
            document.getElementById('agri-chart-title').innerText = `🍅 Agricultural Commodities (${marketData.name})`;
            
            const filteredDatasets = {};
            for (const [key, item] of Object.entries(marketData.datasets)) {
                filteredDatasets[key] = { ...item, data: item.data.slice(-currentDays) };
            }

            renderMetrics(filteredDatasets);
            renderCharts(filteredDatasets);
            
            document.getElementById('energy-chart-wrapper').style.display = 
                filteredDatasets.natural_gas ? 'block' : 'none';
        }

        function renderMetrics(datasets) {
            const container = document.getElementById('metrics-container');
            container.innerHTML = '';
            
            for (const [key, item] of Object.entries(datasets)) {
                if (item.data.length < 2) continue;
                
                const latest = item.data[item.data.length - 1].price;
                const prev = item.data[0].price;
                const change = ((latest - prev) / prev * 100).toFixed(2);
                
                const color = change >= 0 ? '#10b981' : '#ef4444';
                const arrow = change >= 0 ? '▲' : '▼';

                const timeframeLabels = { 2: '1D', 7: '1W', 30: '1M', 90: '3M', 365: '1Y' };
                const timeframeText = timeframeLabels[currentDays] || `${currentDays}d`;

                container.innerHTML += `
                    <div style="background: var(--surface-light); border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; text-align: center;">
                        <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem;">${item.name}</div>
                        <div style="font-size: 1.4rem; font-weight: 700; color: var(--text-primary);">${latest.toFixed(2)} <span style="font-size: 0.8rem; color: var(--text-secondary);">${item.unit}</span></div>
                        <div style="font-size: 0.85rem; margin-top: 0.25rem; font-weight: 500; color: ${color};">
                            ${arrow} ${Math.abs(change)}% <span style="color: var(--text-secondary); font-weight: normal; font-size: 0.75rem;">(${timeframeText})</span>
                        </div>
                    </div>
                `;
            }
        }

        function renderCharts(datasets) {
            const agriDatasets = [];
            let energyDataset = null;
            let labels = [];

            for (const [key, item] of Object.entries(datasets)) {
                if (labels.length === 0) labels = item.data.map(d => d.date);
                
                const dSet = {
                    label: item.name,
                    data: item.data.map(d => ({x: d.date, y: d.price})),
                    borderColor: item.color,
                    borderWidth: 2,
                    tension: 0.4,
                    pointRadius: currentDays > 90 ? 0 : 3
                };

                if (key === 'natural_gas') {
                    dSet.backgroundColor = 'rgba(59, 130, 246, 0.1)';
                    dSet.fill = true;
                    energyDataset = dSet;
                } else {
                    if (key === 'tomato') {
                        dSet.backgroundColor = 'rgba(239, 68, 68, 0.1)';
                        dSet.fill = true;
                    }
                    agriDatasets.push(dSet);
                }
            }

            const chartOptions = {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                layout: {
                    padding: {
                        bottom: 15
                    }
                },
                scales: {
                    x: { type: 'time', time: { unit: currentDays > 90 ? 'month' : 'day' } },
                    y: { beginAtZero: false }
                }
            };

            if (agriChartInstance) agriChartInstance.destroy();
            agriChartInstance = new Chart(document.getElementById('agriChart'), {
                type: 'line',
                data: { datasets: agriDatasets },
                options: chartOptions
            });

            if (energyDataset) {
                if (energyChartInstance) energyChartInstance.destroy();
                energyChartInstance = new Chart(document.getElementById('energyChart'), {
                    type: 'line',
                    data: { datasets: [energyDataset] },
                    options: { ...chartOptions, plugins: { legend: { display: false } } }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', initMarketDashboard);
    </script>
<!-- SCRIPTS_END -->
