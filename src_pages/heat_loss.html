<!-- TITLE: Smart Farm Precision Calculator | AgTech Precision Suite -->
<!-- DESC: Free agricultural engineering and greenhouse climate precision calculators, including Leaf Vapor Pressure Deficit (VPD), fertilizer compounding, mixing valves, and heat loss. -->
<!-- KEYWORDS: smart farm, greenhouse calculator, VPD calculator, fertigation, mixing valve, heat loss, agriculture, engineering -->
<!-- ACTIVE_TAB: btn-tab-heat-loss -->
<!-- ACTIVE_CHIP: chip-all -->
<div class="calc-wrapper active" id="section-heat-loss">
<div class="form-panel">
<h2 class="panel-title" id="lbl-heat-loss-title-ui">Structure &amp; Climate Data</h2>
<div class="input-group">
<div class="input-header">
<label for="hl-preset" id="lbl-hl-preset">Cover Material U-Value Preset</label>
</div>
<div class="input-control-wrapper select-arrow-wrapper">
<select id="hl-preset" onchange="applyHlPreset()">
<option selected="" value="custom">Custom Input</option>
<option value="single_poly">Single Poly (U=6.0)</option>
<option value="double_poly">Double Poly (U=3.5)</option>
<option value="glass">Single Glass (U=5.5)</option>
<option value="double_glass">Double Glass (U=3.0)</option>
<option value="pc_8">PC Sheet 8mm (U=3.3)</option>
<option value="pc_16">PC Sheet 16mm (U=2.3)</option>
</select>
</div>
</div>
<div class="input-group">
<div class="input-header">
<label for="hl-area" id="lbl-hl-area">Cover Surface Area (A)</label>
</div>
<div class="input-control-wrapper">
<input id="hl-area" oninput="calculateHeatLossEngine()" step="50" type="number" value="1500"/>
<span class="suffix" id="hl-area-suffix">m²</span>
</div>
<div class="pyeong-helper" id="hl-area-pyeong" style="font-size: 0.8rem; color: var(--text-gray); margin-top: 0.25rem; font-weight: 600;"></div>
</div>
<div class="input-group">
<div class="input-header">
<label for="hl-uvalue" id="lbl-hl-uvalue">Heat Transfer Coeff (U-value)</label>
</div>
<div class="input-control-wrapper">
<input id="hl-uvalue" oninput="calculateHeatLossEngine()" step="0.1" type="number" value="5.5"/>
<span class="suffix" id="hl-uvalue-suffix">W/m²·K</span>
</div>
</div>
<div class="input-group">
<div class="input-header">
<label for="hl-temp-in" id="lbl-hl-temp-in">Target Indoor Temp (Ti)</label>
</div>
<div class="input-control-wrapper">
<input id="hl-temp-in" oninput="calculateHeatLossEngine()" step="1" type="number" value="18"/>
<span class="suffix" id="hl-temp-in-suffix">°C</span>
</div>
</div>
<div class="input-group">
<div class="input-header">
<label for="hl-temp-out" id="lbl-hl-temp-out">Design Outdoor Temp (To)</label>
</div>
<div class="input-control-wrapper">
<input id="hl-temp-out" oninput="calculateHeatLossEngine()" step="1" type="number" value="-5"/>
<span class="suffix" id="hl-temp-out-suffix">°C</span>
</div>
</div>
<div class="input-group">
<div class="input-header">
<label for="hl-wind" id="lbl-hl-wind">Outdoor Wind Speed</label>
</div>
<div class="input-control-wrapper">
<input id="hl-wind" oninput="calculateHeatLossEngine()" step="0.5" type="number" value="3.0"/>
<span class="suffix" id="hl-wind-suffix">m/s</span>
</div>
</div>
</div>
<div class="result-panel">
<div class="result-header" id="lbl-hl-result-hdr">Required Heating Capacity</div>
<div class="big-number" id="hl-value">0.0 kW</div>
<div class="status-pill optimal" id="hl-status-pill">Heat Loss Calculated</div>
<p class="result-desc" id="hl-explanation">Ready...</p>
<div class="info-card" id="hl-actions-card" style="border-left: 4px solid var(--primary); margin-top: 1.5rem;">
<h4 id="lbl-hl-actions-title">Live Diagnostic Report</h4>
<p id="hl-actions-list" style="font-size: 0.9rem; color: var(--text-gray); margin-top: 0.5rem; line-height: 1.6;"></p>
</div>
<div class="info-card">
<h3 id="lbl-hl-tip-title">Wind Friction Effects</h4>
<p id="hl-tip-desc">High wind speed increases convective heat loss from the cover. This calculator applies up to a 1.4x modifier based on wind speed.</p>
</div>
</div>
</div>
