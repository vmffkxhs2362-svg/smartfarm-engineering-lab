<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenhouse Heat Loss Calculator | SmartFarm Engineering</title>
    <meta name="description" content="Calculate greenhouse heat loss (Watts) based on U-value, area, and temperature differentials.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 33, 62, 0.65);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #f43f5e;
            --accent-hover: #e11d48;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at top left, #1e1b4b, #0b0f19);
        }
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 5px;
            text-align: center;
            background: linear-gradient(135deg, #fda4af, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 0.95rem;
            font-weight: 300;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .input-group input, .input-group select {
            width: 100%;
            background: rgba(11, 15, 25, 0.7);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 15px 18px;
            border-radius: 14px;
            font-size: 1.05rem;
            outline: none;
            transition: all 0.25s ease;
            appearance: none;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15);
        }
        .input-group select {
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 18px top 50%;
            background-size: 12px auto;
        }
        .result-box {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.1), rgba(244, 63, 94, 0.02));
            border: 1px solid rgba(244, 63, 94, 0.2);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-top: 35px;
            position: relative;
            overflow: hidden;
        }
        .result-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }
        .result-label {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }
        .result-value {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-main);
            text-shadow: 0 0 30px rgba(244, 63, 94, 0.5);
            margin-bottom: 5px;
        }
        .result-unit {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: 600;
        }
        .ad-space {
            margin-top: 30px;
            text-align: center;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            color: var(--text-muted);
            font-size: 0.85rem;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .ad-space:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.02);
        }
        .ad-highlight {
            color: #fbbf24;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Heat Loss Calculator</h1>
        <p class="subtitle">Q = U × A × ΔT | smartfarm.inwoovation.com</p>

        <div class="input-group">
            <label for="material">Cladding Material (U-value)</label>
            <select id="material">
                <option value="6.0">Single Glass (U=6.0 W/m²K)</option>
                <option value="4.6">Single Poly Film (U=4.6 W/m²K)</option>
                <option value="3.0">Double Poly Inflated (U=3.0 W/m²K)</option>
                <option value="2.8">Double Glass (U=2.8 W/m²K)</option>
                <option value="1.8">Polycarbonate Multi-wall (U=1.8 W/m²K)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="area">Exposed Surface Area (m²)</label>
            <input type="number" id="area" placeholder="e.g. 500" min="0" step="10" value="500">
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label for="t-in">Target Inside Temp (°C)</label>
                <input type="number" id="t-in" placeholder="e.g. 20" value="20" step="1">
            </div>
            <div class="input-group">
                <label for="t-out">Coldest Outside Temp (°C)</label>
                <input type="number" id="t-out" placeholder="e.g. -5" value="-5" step="1">
            </div>
        </div>

        <div class="result-box">
            <div class="result-label">Maximum Heat Loss</div>
            <div class="result-value" id="heat-result">0.0</div>
            <div class="result-unit">Kilowatts (kW)</div>
        </div>

        <div class="ad-space" onclick="window.open('https://amazon.com', '_blank')">
            <span class="ad-highlight">Reduce Heat Loss by 40%</span>
            Thermal Screens & Multi-layer Poly Films for Greenhouses
            <br><span style="font-size: 0.75rem;">Click to view B2B energy-saving materials</span>
        </div>
    </div>

    <script>
        const uValueInput = document.getElementById('material');
        const areaInput = document.getElementById('area');
        const tInInput = document.getElementById('t-in');
        const tOutInput = document.getElementById('t-out');
        const resultDisplay = document.getElementById('heat-result');

        function calculateHeatLoss() {
            const U = parseFloat(uValueInput.value) || 0;
            const A = parseFloat(areaInput.value) || 0;
            const Tin = parseFloat(tInInput.value) || 0;
            const Tout = parseFloat(tOutInput.value) || 0;
            
            // delta T = Tin - Tout
            const deltaT = Tin - Tout;

            // Q = U * A * deltaT (in Watts)
            let heatLossWatts = 0;
            if (deltaT > 0 && A > 0) {
                heatLossWatts = U * A * deltaT;
            }

            // Convert to Kilowatts
            const heatLossKW = heatLossWatts / 1000;
            
            resultDisplay.textContent = heatLossKW.toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1});
        }

        uValueInput.addEventListener('change', calculateHeatLoss);
        areaInput.addEventListener('input', calculateHeatLoss);
        tInInput.addEventListener('input', calculateHeatLoss);
        tOutInput.addEventListener('input', calculateHeatLoss);
        
        // Initial Calculation
        calculateHeatLoss();
    </script>
</body>
</html>
